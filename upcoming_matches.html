<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Clean Schedule (OBS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00F0FF;
    --purple: #B026FF;
    --bg-base: #050507;
    
    --card-bg: rgba(20, 20, 24, 0.4);
    --card-border: 1px solid rgba(255, 255, 255, 0.04);
    --card-blur: blur(20px);
    
    --text-main: #FFFFFF;
    --text-muted: #6E6E80;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; 
    background-color: var(--bg-base);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-main);
  }

  /* Very subtle ambient background lighting */
  body::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50vh;
    background: radial-gradient(ellipse at top, rgba(255,255,255,0.02) 0%, transparent 70%);
    z-index: -1; pointer-events: none;
  }
  
  #app {
    display: flex; flex-direction: column; width: 100%; height: 100%; 
    padding: 60px 80px; gap: 50px;
  }

  /* ================================
     HEADER (Minimalist)
     ================================ */
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0; padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .brand-group { display: flex; align-items: baseline; gap: 20px; }
  .brand-logo { 
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 42px; 
    letter-spacing: 2px; color: var(--text-main);
  }
  .brand-sub {
    font-size: 18px; font-weight: 600; letter-spacing: 6px; 
    color: var(--text-muted); text-transform: uppercase;
  }
  .live-indicator {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--text-muted); letter-spacing: 2px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: blink 2s infinite ease-in-out;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ================================
     GRID SYSTEM
     ================================ */
  .schedule-grid {
    flex: 1; display: grid; 
    grid-template-columns: repeat(2, 1fr);
    gap: 30px; 
    align-content: center; 
    justify-content: center;
  }

  /* ================================
     CLEAN CARDS
     ================================ */
  .match-card {
    background: var(--card-bg);
    backdrop-filter: var(--card-blur);
    -webkit-backdrop-filter: var(--card-blur);
    border: var(--card-border);
    border-radius: 16px;
    padding: 35px 40px;
    display: flex; flex-direction: column; gap: 25px;
    position: relative; overflow: hidden;
  }

  /* Detailed delicate accents */
  .match-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.6;
  }
  .match-card:nth-child(even)::before {
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
  }

  /* Card Header: Time & Date */
  .c-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .c-datetime { display: flex; align-items: baseline; gap: 15px; }
  .c-time { 
    font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 700; 
  }
  .c-date { 
    font-size: 16px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;
  }
  
  /* Accent Dots */
  .accent-dot { width: 8px; height: 8px; border-radius: 50%; }
  .match-card:nth-child(odd) .accent-dot { background: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.6); }
  .match-card:nth-child(even) .accent-dot { background: var(--purple); box-shadow: 0 0 12px rgba(176, 38, 255, 0.6); }

  /* Card Body: Teams */
  .c-body {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
  }
  
  .c-team { display: flex; align-items: center; gap: 25px; flex: 1; min-width: 0; }
  .c-team.right { justify-content: flex-end; text-align: right; flex-direction: row-reverse; }
  
  .c-logo { 
    width: 70px; height: 70px; object-fit: contain; flex-shrink: 0;
  }
  /* Subtle glow behind logos based on accent color */
  .match-card:nth-child(odd) .c-logo { filter: drop-shadow(0 4px 15px rgba(0, 240, 255, 0.15)); }
  .match-card:nth-child(even) .c-logo { filter: drop-shadow(0 4px 15px rgba(176, 38, 255, 0.15)); }

  .c-name { 
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; 
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    letter-spacing: 1.5px;
  }
  .c-team.right .c-name { color: var(--text-muted); }

  .c-divider {
    width: 1px; height: 40px; background: rgba(255,255,255,0.05); margin: 0 20px;
  }

  .empty-state {
    grid-column: span 2; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 20px;
    color: var(--text-muted); padding: 100px; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="app">
  
  <div class="header-bar">
    <div class="brand-group">
      <div class="brand-logo">UIC</div>
      <div class="brand-sub">SCHEDULE</div>
    </div>
    <div class="live-indicator">
      <div class="live-dot"></div>
      LIVE SYNC
    </div>
  </div>

  <div class="schedule-grid" id="schedule-grid">
     <!-- Populated by JS -->
  </div>

</div>

<script>
(() => {
  const scheduleGrid = document.getElementById("schedule-grid");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Sleek Shield Silhouette for Missing Logos
  const fallbackLogo = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.03)' stroke='rgba(255,255,255,0.1)' stroke-width='0.5'%3E%3Cpath d='M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z'/%3E%3C/svg%3E";

  function formatRelativeTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const timeStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d);
    
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const matchDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

    let dayStr = "";
    if (diffDays === 0) dayStr = "HEUTE";
    else if (diffDays === 1) dayStr = "MORGEN";
    else dayStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);

    return { dayStr, timeStr };
  }

  async function load(){
    try{
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamData.teamDisplay || `UIC ${teamKey.toUpperCase()}`,
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentName: m.enemy_team?.name || m.enemy_team?.team_tag || "TBD" 
            });
          }
        });
      }

      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
      const list = upcomingMatches.slice(0, 6);

      if(!list.length){
        scheduleGrid.innerHTML = `<div class="empty-state">KEINE MATCHES GEPLANT</div>`;
        return;
      }
      
      scheduleGrid.innerHTML = list.map(m => {
        const time = formatRelativeTime(m.startsAt);
        const uLogo = m.uicLogo ? esc(m.uicLogo) : fallbackLogo;
        const eLogo = m.opponentLogo ? esc(m.opponentLogo) : fallbackLogo;

        return `
          <div class="match-card">
            <div class="c-header">
              <div class="c-datetime">
                <span class="c-time">${time.timeStr}</span>
                <span class="c-date">${time.dayStr}</span>
              </div>
              <div class="accent-dot"></div>
            </div>
            <div class="c-body">
              <div class="c-team">
                <img class="c-logo" src="${uLogo}" onerror="this.src='${fallbackLogo}';">
                <div class="c-name">${esc(m.uicTeamName)}</div>
              </div>
              <div class="c-divider"></div>
              <div class="c-team right">
                <div class="c-name">${esc(m.opponentName)}</div>
                <img class="c-logo" src="${eLogo}" onerror="this.src='${fallbackLogo}';">
              </div>
            </div>
          </div>
        `;
      }).join("");

    } catch(e) {
      scheduleGrid.innerHTML = `<div class="empty-state">VERBINDUNG FEHLGESCHLAGEN</div>`;
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  setInterval(load, 120000); // 2 min sync
})();
</script>
</body>
</html>
