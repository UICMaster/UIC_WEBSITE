<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Ticker (OBS) - Live Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00E5FF;
    --purple: #8A2BE2;
    --deep-blue: #0A0F1A;
    --dark-bg: rgba(7, 10, 16, 0.95);
    
    --text-main: #FFFFFF;
    --text-muted: #8E8E9F;
    
    --ticker-height: 70px; 
  }
  
  * { box-sizing: border-box; }
  
  /* Transparenter Hintergrund für OBS */
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; 
    background-color: rgba(0, 0, 0, 0);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-main);
  }

  /* ================================
     TICKER CONTAINER
     ================================ */
  #ticker-container {
    position: fixed;
    bottom: 0; left: 0; width: 100vw; height: var(--ticker-height);
    background: var(--dark-bg);
    display: flex; align-items: center; overflow: hidden;
    border-top: 3px solid var(--cyan);
    box-shadow: 0 -5px 25px rgba(0, 229, 255, 0.15);
  }

  #ticker-container::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 300%; height: 100%;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 150px,
      rgba(0, 229, 255, 0.03) 150px, rgba(0, 229, 255, 0.03) 170px,
      transparent 170px, transparent 250px,
      rgba(138, 43, 226, 0.04) 250px, rgba(138, 43, 226, 0.04) 280px
    );
    animation: slideBeams 20s linear infinite;
    z-index: 0; pointer-events: none;
  }

  @keyframes slideBeams {
    0% { transform: translateX(0); }
    100% { transform: translateX(1000px); }
  }

  /* ================================
     BRANDING BLOCK (Links)
     ================================ */
  .ticker-brand {
    position: relative; z-index: 10; height: 100%;
    display: flex; align-items: center; padding: 0 40px 0 25px;
    background: linear-gradient(135deg, var(--deep-blue) 0%, #150A2A 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 25px) 100%, 0% 100%);
    border-right: 4px solid var(--purple);
  }
  
  .ticker-brand::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
    background: var(--purple); box-shadow: -2px 0 10px var(--purple);
  }
  
  .brand-logo { 
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 26px; 
    letter-spacing: 3px; color: var(--text-main);
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  
  .live-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan), 0 0 20px var(--cyan);
    margin-left: 20px; animation: blink 1.2s infinite ease-in-out;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* ================================
     SCROLLING TRACK
     ================================ */
  .ticker-viewport {
    flex: 1; height: 100%; overflow: hidden; position: relative; z-index: 1;
    mask-image: linear-gradient(to right, transparent, black 3%, black 98%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 98%, transparent);
  }

  .ticker-track {
    display: flex; height: 100%; width: max-content; will-change: transform;
  }

  @keyframes scrollTicker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ================================
     MATCH ITEM COMPONENT
     ================================ */
  .match-item {
    display: flex; align-items: center; height: 100%; padding: 0 35px;
    position: relative; white-space: nowrap; gap: 15px;
  }

  /* Schräger Trennstrich zwischen den Matches */
  .match-item::after {
    content: ''; position: absolute; right: 0; top: 25%; height: 50%; width: 2px;
    background: rgba(255, 255, 255, 0.1); transform: skewX(-20deg);
  }

  .m-time-badge {
    background: rgba(255, 255, 255, 0.03);
    padding: 4px 14px;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0% 100%);
    border-left: 3px solid var(--purple);
    font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; color: var(--text-muted);
  }
  .m-time-badge.heute { 
    border-left-color: var(--cyan); color: var(--cyan); background: rgba(0, 229, 255, 0.05); 
  }

  .m-team { display: flex; align-items: center; gap: 12px; }
  .m-logo { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
  .m-name { font-family: 'Orbitron', sans-serif; font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }

  .m-vs { 
    font-size: 16px; font-weight: 900; color: var(--purple); 
    margin: 0 8px; font-style: italic; font-family: 'Orbitron', sans-serif; 
  }

  .system-message {
    padding: 0 30px; font-family: 'Orbitron', sans-serif;
    color: var(--cyan); display: flex; align-items: center; height: 100%; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="ticker-container">
  <div class="ticker-brand">
    <span class="brand-logo">UIC</span>
    <div class="live-dot"></div>
  </div>
  
  <div class="ticker-viewport">
    <div class="ticker-track" id="ticker-track">
      <div class="system-message">LADE DATA LAKE...</div>
    </div>
  </div>
</div>

<script>
(function() {
  var tickerTrack = document.getElementById("ticker-track");
  var esc = function(s) {
    if (s === null || s === undefined) s = "";
    return String(s).replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };

  // Neues Placeholder Logo: Neutraler geometrischer Cyber-Knotenpunkt anstelle des Fehler-Schilds
  var fallbackLogo = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.02)' stroke='rgba(255,255,255,0.2)' stroke-width='1'%3E%3Cpolygon points='12 2 22 8 22 16 12 22 2 16 2 8'/%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3Cline x1='12' y1='2' x2='12' y2='8'/%3E%3Cline x1='12' y1='16' x2='12' y2='22'/%3E%3Cline x1='2' y1='8' x2='7.5' y2='11'/%3E%3Cline x1='16.5' y1='13' x2='22' y2='16'/%3E%3Cline x1='2' y1='16' x2='7.5' y2='13'/%3E%3Cline x1='16.5' y1='11' x2='22' y2='8'/%3E%3C/svg%3E";

  var lastDataHash = "";
  var TICKER_SPEED_PX_PER_SEC = 65; 

  function formatRelativeTime(iso) {
    if (!iso) return { label: "TBD", isToday: false };
    var d = new Date(iso);
    var now = new Date();
    var timeStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d) + " UHR";
    
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var matchDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

    var dayStr = "";
    var isToday = false;
    
    if (diffDays === 0) { dayStr = "HEUTE"; isToday = true; }
    else if (diffDays === 1) { dayStr = "MORGEN"; }
    else { dayStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d); }

    return { label: dayStr + " " + timeStr, isToday: isToday };
  }

  function generateMatchHTML(m) {
    var time = formatRelativeTime(m.startsAt);
    var uLogo = m.uicLogo ? esc(m.uicLogo) : fallbackLogo;
    var eLogo = m.opponentLogo ? esc(m.opponentLogo) : fallbackLogo;
    var badgeClass = time.isToday ? "m-time-badge heute" : "m-time-badge";

    return '' +
      '<div class="match-item">' +
        '<div class="' + badgeClass + '">' + time.label + '</div>' +
        '<div class="m-team">' +
          '<img class="m-logo" src="' + uLogo + '" onerror="this.src=\'' + fallbackLogo + '\';">' +
          '<span class="m-name">' + esc(m.uicTeamName) + '</span>' +
        '</div>' +
        '<span class="m-vs">VS</span>' +
        '<div class="m-team">' +
          '<span class="m-name">' + esc(m.opponentName) + '</span>' +
          '<img class="m-logo" src="' + eLogo + '" onerror="this.src=\'' + fallbackLogo + '\';">' +
        '</div>' +
      '</div>';
  }

  function load() {
    var fetchUrl = "data/prime_stats.json?t=" + new Date().getTime();

    fetch(fetchUrl, {cache: "no-store"})
      .then(function(r) {
        if (!r.ok) throw new Error("JSON 404");
        return r.json();
      })
      .then(function(data) {
        var upcomingMatches = [];
        var now = new Date();

        for (var teamKey in data) {
          if (!data.hasOwnProperty(teamKey)) continue;
          if (teamKey.toLowerCase() === "community") continue;
          
          var teamData = data[teamKey];
          if (!teamData.api_meta || !teamData.matches || !Array.isArray(teamData.matches)) continue;

          for (var i = 0; i < teamData.matches.length; i++) {
            var m = teamData.matches[i];
            var mDate = m.begin ? new Date(m.begin) : null;
            
            // STRICT FILTER: Confirmed, kein Ergebnis, Datum in Zukunft
            if (m.confirmed === true && (!m.result) && (!mDate || mDate > now)) {
              
              var teamDisplayName = teamData.teamDisplay ? teamData.teamDisplay : "UIC " + teamKey.toUpperCase();
              var uicLogoStr = (teamData.api_meta && teamData.api_meta.logo_url) ? teamData.api_meta.logo_url : "";
              var enemyLogoStr = (m.enemy_team && m.enemy_team.logo_url) ? m.enemy_team.logo_url : "";
              var enemyNameStr = "TBD";
              
              if (m.enemy_team) {
                enemyNameStr = m.enemy_team.name ? m.enemy_team.name : (m.enemy_team.team_tag ? m.enemy_team.team_tag : "TBD");
              }

              upcomingMatches.push({
                startsAt: m.begin,
                uicTeamName: teamDisplayName,
                uicLogo: uicLogoStr,
                opponentLogo: enemyLogoStr,
                opponentName: enemyNameStr
              });
            }
          }
        }

        upcomingMatches.sort(function(a, b) {
          if (!a.startsAt) return 1;
          if (!b.startsAt) return -1;
          return new Date(a.startsAt) - new Date(b.startsAt);
        });

        // Limitieren auf 15 Einträge für Ticker-Performance
        var list = upcomingMatches.slice(0, 15);

        var currentHash = JSON.stringify(list);
        if (currentHash === lastDataHash) return; 
        lastDataHash = currentHash;

        if (list.length === 0) {
          tickerTrack.style.animation = "none";
          tickerTrack.innerHTML = '<div class="system-message">KEINE BESTÄTIGTEN MATCHES GEPLANT // STANDBY</div>';
          return;
        }

        var displayList = list.slice(0);
        while (displayList.length < 6) {
          displayList = displayList.concat(list);
        }

        var blockHTML = displayList.map(generateMatchHTML).join("");
        tickerTrack.innerHTML = blockHTML + blockHTML;

        tickerTrack.style.animation = "none";
        
        requestAnimationFrame(function() {
          var totalWidth = tickerTrack.scrollWidth;
          var duration = totalWidth / TICKER_SPEED_PX_PER_SEC;
          tickerTrack.style.animation = "scrollTicker " + duration + "s linear infinite";
        });

      })
      .catch(function(e) {
        console.error("OBS Ticker Fetch Error:", e);
        tickerTrack.style.animation = "none";
        tickerTrack.innerHTML = '<div class="system-message" style="color:#ff2a2a;">VERBINDUNGSFEHLER ZUM DATA LAKE</div>';
      });
  }

  load();
  setInterval(load, 120000); 
})();
</script>
</body>
</html>
