<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Match Schedule (OBS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00F0FF;
    --purple: #B026FF;
    --bg-base: #030305;
    
    /* Glassmorphism Variables */
    --glass-bg: rgba(18, 18, 24, 0.6);
    --glass-border: 1px solid rgba(255, 255, 255, 0.08);
    --glass-edge: inset 0 1px 1px rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    --glass-blur: blur(30px);
    
    --text-main: #FFFFFF;
    --text-muted: #8A8A9E;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; 
    background-color: var(--bg-base);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-main);
  }

  /* Ambient glowing orbs to refract through the glass */
  body::before, body::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(140px); z-index: -1; opacity: 0.35;
  }
  body::before {
    top: -10%; left: -10%; width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(0,240,255,0.25) 0%, transparent 60%);
  }
  body::after {
    bottom: -20%; right: -10%; width: 70vw; height: 70vw;
    background: radial-gradient(circle, rgba(176,38,255,0.2) 0%, transparent 60%);
  }
  
  #app {
    display: flex; flex-direction: column; width: 100%; height: 100%; 
    padding: 60px 80px; gap: 40px;
  }

  /* ================================
     HEADER
     ================================ */
  .header-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-shrink: 0;
  }
  .brand-logo { 
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 64px; 
    line-height: 1; letter-spacing: 2px;
    background: linear-gradient(to right, var(--cyan), #fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(0,240,255,0.2));
  }
  .brand-sub {
    font-size: 22px; font-weight: 700; letter-spacing: 8px; 
    color: var(--text-muted); text-transform: uppercase; margin-top: 8px;
  }
  .status-text {
    font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.3);
    letter-spacing: 2px; text-transform: uppercase;
  }

  /* ================================
     OPTIMIZED GRID (Auto-Centering)
     ================================ */
  .schedule-grid {
    flex: 1; display: grid; 
    grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
    gap: 40px; 
    align-content: center; /* Centers the whole grid if few matches exist */
    justify-content: center;
    overflow: hidden;
  }

  /* ================================
     GLASS CARDS
     ================================ */
  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-edge);
    border-radius: 20px;
    display: flex; flex-direction: column;
    padding: 30px 40px;
    position: relative; overflow: hidden;
  }

  /* Alternating side stripes */
  .glass-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: var(--cyan);
  }
  .glass-card:nth-child(even)::before { background: var(--purple); }

  .c-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 15px; margin-bottom: 25px;
  }
  .c-date { font-size: 22px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px;}
  .c-time { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 700; color: var(--text-main); }
  
  .glass-card:nth-child(odd) .c-time { color: var(--cyan); text-shadow: 0 0 15px rgba(0,240,255,0.3); }
  .glass-card:nth-child(even) .c-time { color: var(--purple); text-shadow: 0 0 15px rgba(176,38,255,0.3); }

  .c-body {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
  }
  
  .c-team { display: flex; align-items: center; gap: 20px; flex: 1; min-width: 0; }
  .c-team.right { justify-content: flex-end; text-align: right; flex-direction: row-reverse; }
  
  .c-logo { 
    width: 80px; height: 80px; object-fit: contain; flex-shrink: 0;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
  }
  .c-name { 
    font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; 
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    letter-spacing: 1px;
  }

  .c-vs {
    font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; font-style: italic;
    color: rgba(255,255,255,0.1); padding: 0 25px;
  }

  .empty-state {
    grid-column: span 2; text-align: center; font-family: 'Orbitron', sans-serif; font-size: 28px;
    color: var(--text-muted); padding: 100px;
  }
</style>
</head>
<body>
<div id="app">
  
  <!-- HEADER -->
  <div class="header-bar">
    <div>
      <div class="brand-logo">UIC</div>
      <div class="brand-sub">MATCH SCHEDULE</div>
    </div>
    <div class="status-text" id="status-bar">LADE DATENLAKE...</div>
  </div>

  <!-- AUTO-CENTERING GRID -->
  <div class="schedule-grid" id="schedule-grid">
     <!-- Populated by JS -->
  </div>

</div>

<script>
(() => {
  const scheduleGrid = document.getElementById("schedule-grid");
  const statusBar = document.getElementById("status-bar");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Sleek Shield Silhouette for Missing Logos
  const fallbackLogo = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.1)' stroke-width='0.5'%3E%3Cpath d='M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z'/%3E%3C/svg%3E";

  function formatRelativeTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const timeStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d);
    
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const matchDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

    let dayStr = "";
    if (diffDays === 0) dayStr = "HEUTE";
    else if (diffDays === 1) dayStr = "MORGEN";
    else dayStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);

    return { dayStr, timeStr };
  }

  async function load(){
    try{
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamData.teamDisplay || `UIC ${teamKey.toUpperCase()}`,
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentName: m.enemy_team?.name || m.enemy_team?.team_tag || "TBD" 
            });
          }
        });
      }

      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
      statusBar.textContent = `TELEMETRY SYNCED // ${new Date().toLocaleTimeString('de-DE')}`;

      // Cap at 6 matches to guarantee a beautiful 2x3 grid. 
      // If there are less than 6, CSS `align-content: center` handles centering automatically.
      const list = upcomingMatches.slice(0, 6);

      if(!list.length){
        scheduleGrid.innerHTML = `<div class="empty-state">KEINE BESTÄTIGTEN MATCHES GEPLANT</div>`;
        return;
      }
      
      scheduleGrid.innerHTML = list.map(m => {
        const time = formatRelativeTime(m.startsAt);
        const uLogo = m.uicLogo ? esc(m.uicLogo) : fallbackLogo;
        const eLogo = m.opponentLogo ? esc(m.opponentLogo) : fallbackLogo;

        return `
          <div class="glass-card">
            <div class="c-header">
              <span class="c-date">${time.dayStr}</span>
              <span class="c-time">${time.timeStr} UHR</span>
            </div>
            <div class="c-body">
              <div class="c-team">
                <img class="c-logo" src="${uLogo}" onerror="this.src='${fallbackLogo}';">
                <div class="c-name">${esc(m.uicTeamName)}</div>
              </div>
              <div class="c-vs">VS</div>
              <div class="c-team right">
                <div class="c-name" style="color: var(--text-muted);">${esc(m.opponentName)}</div>
                <img class="c-logo" src="${eLogo}" onerror="this.src='${fallbackLogo}';">
              </div>
            </div>
          </div>
        `;
      }).join("");

    } catch(e) {
      scheduleGrid.innerHTML = `<div class="empty-state">VERBINDUNG FEHLGESCHLAGEN</div>`;
      statusBar.textContent = "OFFLINE";
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  setInterval(load, 120000); // 2 min sync
})();
</script>
</body>
</html>
