<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Upcoming Matches</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:200px;height:450px;overflow:hidden;background:transparent}
  body{font-family:Arial,Helvetica,sans-serif;color:#fff}
  #overlay{
    width:200px;height:450px;padding:7px 8px 5px 5px;
    background:linear-gradient(100deg,rgba(7,8,9,.97),rgba(14,15,16,.91));
    position:relative;overflow:hidden;
  }
  #overlay:before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
    background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.05) 9px,transparent 10px 17px);
  }
  .brand{position:relative;text-align:left;margin:0 0 5px 5px}
  .brand-main{font-size:27px;line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-2px;text-shadow:0 0 5px rgba(255,255,255,0.2)}
  .brand-sub{font-size:6px;letter-spacing:2.1px;margin-top:4px;color:#ddd}
  .gold{color:#d7aa50}
  .rule{height:1px;background:linear-gradient(90deg,#d7aa50,#6f6f6f,transparent);margin:5px 0 6px}
  .heading{position:relative;margin-left:5px;margin-bottom:5px}
  .heading .up{font-size:15px;font-weight:1000;letter-spacing:.2px}
  .heading .matches{font-size:20px;font-weight:1000;font-style:italic;letter-spacing:-.7px;color:#d7aa50;line-height:.9;text-shadow:0 0 8px rgba(215,170,80,0.4)}
  #matches{position:relative;display:flex;flex-direction:column;gap:5px}
  .match{height:105px;position:relative;border-bottom:1px solid rgba(215,170,80,.72);padding-bottom:4px}
  .datebar{
    height:26px;display:flex;align-items:center;gap:10px;padding:0 8px;
    border-top:1px solid rgba(215,170,80,.85);border-bottom:1px solid rgba(215,170,80,.85);
    background:linear-gradient(90deg,rgba(30,30,30,.95),rgba(15,15,15,.6));
    clip-path:polygon(0 0,100% 0,92% 100%,0 100%);
  }
  .date{font-size:15px;font-weight:1000}
  .time{font-size:15px;font-weight:1000;color:#d7aa50;text-shadow:0 0 5px rgba(215,170,80,0.5)}
  .versus{height:72px;display:grid;grid-template-columns:70px 30px 70px;align-items:center;justify-content:center;gap:2px}
  .team{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .logo{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
  .tag{font-size:7px;font-weight:900;letter-spacing:1.8px;margin-top:1px;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .vs{font-size:14px;font-weight:1000;text-align:center;color:#eee}
  .vs:after{content:"";display:block;width:16px;height:2px;background:#d7aa50;margin:3px auto 0;box-shadow:0 0 3px #d7aa50}
  #status{position:relative;font-size:10px;padding:10px 5px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<div id="overlay">
  <div class="brand">
    <div class="brand-main">UIC</div>
    <div class="brand-sub">ULTRA INSTINCT CREW</div>
  </div>
  <div class="rule"></div>
  <div class="heading">
    <div class="up">UPCOMING</div>
    <div class="matches">MATCHES</div>
  </div>
  <div id="matches"></div>
  <div id="status"></div>
</div>
<script>
(() => {
  const matches = document.getElementById("matches");
  const status = document.getElementById("status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Handles time zone conversion automatically
  function parts(iso){
    const d = new Date(iso);
    const date = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);
    const time = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
    return {date, time};
  }

  async function load(){
    try{
      // Fetch the Golden JSON Data Lake
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      // Loop through all teams in the data lake
      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          // STRICT FILTER: Must be confirmed, must be in the future, must not have a result yet
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamKey, // e.g. "spark"
              // DYNAMIC UIC LOGO: Pulls from the api_meta block
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentTag: m.enemy_team?.team_tag || "TBD"
            });
          }
        });
      }

      // Sort chronologically across the entire organization
      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
      const list = upcomingMatches.slice(0, 3); // Take the top 3

      if(!list.length){
        matches.innerHTML = "";
        status.textContent = "Aktuell keine bestätigten Matches.";
        return;
      }
      
      status.textContent = "";
      
      // Render the HTML
      matches.innerHTML = list.map(m => {
        const p = parts(m.startsAt);
        return `<div class="match">
          <div class="datebar"><span class="date">${esc(p.date)}</span><span class="time">${esc(p.time)}</span></div>
          <div class="versus">
            <div class="team">
              <!-- Dynamically uses your specific Prime League Team Logo -->
              <img class="logo" src="${esc(m.uicLogo)}" alt="UIC" onerror="this.style.opacity='0'">
              <div class="tag">${esc(m.uicTeamName)}</div>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <img class="logo" src="${esc(m.opponentLogo)}" alt="${esc(m.opponentTag)}" onerror="this.style.opacity='0'">
              <div class="tag">${esc(m.opponentTag)}</div>
            </div>
          </div>
        </div>`;
      }).join("");
      
    } catch(e) {
      matches.innerHTML = "";
      status.textContent = "Data Lake nicht erreichbar.";
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  // Refresh every 60 seconds
  setInterval(load, 60000);
})();
</script>
</body>
</html>
