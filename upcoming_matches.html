<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Upcoming Schedule (OBS)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; background: transparent;
    font-family: 'Montserrat', Arial, sans-serif;
    color: #fff;
  }
  
  /* OBS Container */
  #overlay {
    width: 100%; height: 100%; padding: 15px;
    background: linear-gradient(135deg, rgba(10,10,12,0.95) 0%, rgba(20,20,24,0.98) 100%);
    position: relative; display: flex; flex-direction: column;
    border-top: 4px solid #d7aa50;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
  }
  
  /* Background Texture */
  #overlay:before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
    background-image: repeating-linear-gradient(45deg, #ffffff 0, #ffffff 1px, transparent 1px, transparent 10px);
  }

  /* BRANDING HEADER */
  .brand-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 20px; position: relative; z-index: 2; flex-shrink: 0;
  }
  .brand-title {
    font-size: 26px; font-weight: 900; font-style: italic; line-height: 0.85;
    text-transform: uppercase; letter-spacing: -1px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
  }
  .brand-subtitle { font-size: 9px; letter-spacing: 3px; color: #888; margin-top: 5px; }
  .brand-radar {
    font-size: 12px; font-weight: 800; color: #d7aa50; letter-spacing: 1px;
    padding: 3px 8px; border: 1px solid rgba(215, 170, 80, 0.3);
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    background: rgba(215, 170, 80, 0.1);
  }

  /* LIST CONTAINER */
  #content-area { 
    display: flex; flex-direction: column; gap: 10px; 
    flex-grow: 1; min-height: 0; overflow: hidden;
  }

  /* MATCH ROW */
  .match-row {
    display: flex; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(30,30,35,0.9), rgba(15,15,18,0.9));
    border: 1px solid rgba(255,255,255,0.05);
    border-left: 3px solid #d7aa50;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .m-time {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 10px 12px; min-width: 75px; flex-shrink: 0;
    background: rgba(255,255,255,0.03);
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .m-date { font-size: 10px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .m-hour { font-size: 15px; font-weight: 900; color: #d7aa50; text-shadow: 0 0 8px rgba(215,170,80,0.4); }

  .m-teams {
    flex-grow: 1; display: grid; grid-template-columns: 1fr 20px 1fr; 
    align-items: center; padding: 5px 12px; gap: 5px; min-width: 0;
  }
  
  .m-team { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .m-team.right { justify-content: flex-end; text-align: right; }
  
  .m-logo { 
    width: 28px; height: 28px; object-fit: contain; flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .m-name { 
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .m-vs { font-size: 11px; font-weight: 900; font-style: italic; color: #555; text-align: center; }

  #status { position: absolute; bottom: 5px; left: 15px; font-size: 9px; color: rgba(255,255,255,0.3); font-weight: 800; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="overlay">
  <div class="brand-header">
    <div>
      <div class="brand-title">UIC</div>
      <div class="brand-subtitle">MATCH SCHEDULE</div>
    </div>
    <div class="brand-radar">LIVE</div>
  </div>

  <div id="content-area"></div>
  <div id="status"></div>
</div>

<script>
(() => {
  const contentArea = document.getElementById("content-area");
  const status = document.getElementById("status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Fallback SVG for missing logos
  const fallbackLogo = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' fill='rgba(255,255,255,0.05)' rx='6'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='rgba(255,255,255,0.2)' font-family='Arial' font-size='14' font-weight='bold'%3E?%3C/text%3E%3C/svg%3E";

  function formatRelativeTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const timeStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d);
    
    // Normalize to midnight for day calculation
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const matchDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

    let dayStr = "";
    if (diffDays === 0) dayStr = "HEUTE";
    else if (diffDays === 1) dayStr = "MORGEN";
    else dayStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);

    return { dayStr, timeStr };
  }

  async function load(){
    try{
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamData.teamDisplay || `UIC ${teamKey.toUpperCase()}`,
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentTag: m.enemy_team?.team_tag || "TBD"
            });
          }
        });
      }

      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
      
      // Fetch up to 6 matches since the design is now flatter and more compact
      const list = upcomingMatches.slice(0, 6); 

      if(!list.length){
        contentArea.innerHTML = `<div style="text-align:center; color:#888; font-weight:800; font-size: 14px; margin-top: 50px;">DERZEIT KEINE BESTÄTIGTEN MATCHES</div>`;
        status.textContent = "Standby.";
        return;
      }
      
      status.textContent = "";
      
      contentArea.innerHTML = list.map(m => {
        const timeData = formatRelativeTime(m.startsAt);
        const uicLogoSrc = m.uicLogo ? esc(m.uicLogo) : fallbackLogo;
        const enemyLogoSrc = m.opponentLogo ? esc(m.opponentLogo) : fallbackLogo;

        return `
          <div class="match-row">
            <div class="m-time">
              <div class="m-date">${timeData.dayStr}</div>
              <div class="m-hour">${timeData.timeStr}</div>
            </div>
            <div class="m-teams">
              <div class="m-team">
                <img class="m-logo" src="${uicLogoSrc}" alt="UIC" onerror="this.src='${fallbackLogo}'; this.onerror=null;">
                <span class="m-name">${esc(m.uicTeamName)}</span>
              </div>
              <div class="m-vs">VS</div>
              <div class="m-team right">
                <span class="m-name" style="color: #ccc;">${esc(m.opponentTag)}</span>
                <img class="m-logo" src="${enemyLogoSrc}" alt="${esc(m.opponentTag)}" onerror="this.src='${fallbackLogo}'; this.onerror=null;">
              </div>
            </div>
          </div>
        `;
      }).join("");
      
    } catch(e) {
      contentArea.innerHTML = "";
      status.textContent = "Verbindung zum Data Lake getrennt.";
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  setInterval(load, 120000); // Update every 2 minutes
})();
</script>
</body>
</html>
