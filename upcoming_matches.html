<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Glassmorphism Match Center (OBS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00F0FF;
    --purple: #B026FF;
    --bg-base: #030305;
    
    /* Glassmorphism Variables */
    --glass-bg: rgba(18, 18, 24, 0.6);
    --glass-border: 1px solid rgba(255, 255, 255, 0.08);
    --glass-edge: inset 0 1px 1px rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    --glass-blur: blur(24px);
    
    --text-main: #FFFFFF;
    --text-muted: #8A8A9E;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; 
    background-color: var(--bg-base);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-main);
  }

  /* The ambient light that makes the glassmorphism visible */
  body::before, body::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(120px); z-index: -1; opacity: 0.4;
  }
  body::before {
    top: -10%; left: -10%; width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(0,240,255,0.2) 0%, transparent 60%);
  }
  body::after {
    bottom: -20%; right: -10%; width: 70vw; height: 70vw;
    background: radial-gradient(circle, rgba(176,38,255,0.15) 0%, transparent 60%);
  }
  
  #app {
    display: flex; width: 100%; height: 100%; padding: 60px; gap: 60px;
  }
  
  /* ================================
     LEFT PANEL: HERO
     ================================ */
  .left-panel {
    flex: 0 0 35%; display: flex; flex-direction: column; justify-content: center;
  }
  
  .brand-logo { 
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 72px; 
    line-height: 1; letter-spacing: 2px;
    background: linear-gradient(to right, var(--cyan), #fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 50px;
    filter: drop-shadow(0 4px 20px rgba(0,240,255,0.2));
  }

  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-edge);
    border-radius: 20px;
  }

  .hero-container {
    padding: 60px 40px; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .hero-time {
    font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700;
    color: var(--text-main); margin-bottom: 40px; text-align: center;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .hero-time span { color: var(--cyan); }

  .hero-matchup { display: flex; align-items: center; justify-content: center; width: 100%; gap: 20px; }
  .hero-team { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
  .hero-logo { width: 160px; height: 160px; object-fit: contain; margin-bottom: 25px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));}
  .hero-name { 
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; 
    text-align: center; text-transform: uppercase; width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 1px;
  }
  
  .hero-vs {
    font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900; font-style: italic;
    color: rgba(255,255,255,0.2); padding: 0 10px;
  }

  /* ================================
     RIGHT PANEL: SCHEDULE
     ================================ */
  .right-panel {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
  }

  .schedule-list {
    display: flex; flex-direction: column; gap: 16px; width: 100%;
  }

  .match-row {
    display: flex; align-items: center; padding: 25px 35px;
    position: relative; overflow: hidden;
  }
  
  /* Subtle brand color accents on the left edge */
  .match-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--cyan); border-radius: 4px 0 0 4px;
  }
  .match-row:nth-child(even)::before { background: var(--purple); }

  .m-datetime {
    display: flex; flex-direction: column; justify-content: center;
    padding-right: 40px; border-right: 1px solid rgba(255,255,255,0.08);
    min-width: 160px;
  }
  .m-date { font-size: 18px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}
  .m-time { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: var(--text-main); }

  .m-teams {
    flex: 1; display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center;
    padding-left: 40px; gap: 20px; min-width: 0;
  }
  
  .m-team { display: flex; align-items: center; gap: 25px; min-width: 0; }
  .m-team.right { justify-content: flex-end; text-align: right; }
  .m-logo { width: 70px; height: 70px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));}
  .m-name { 
    font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; 
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    letter-spacing: 1px;
  }

  .m-vs {
    font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; font-style: italic;
    color: rgba(255,255,255,0.15); text-align: center;
  }

  .empty-state {
    text-align: left; font-family: 'Orbitron', sans-serif; font-size: 24px;
    color: var(--text-muted); padding: 50px 0;
  }
</style>
</head>
<body>
<div id="app">
  
  <!-- LEFT COLUMN -->
  <div class="left-panel">
    <div class="brand-logo">UIC</div>
    <div id="hero-card">
       <!-- Populated by JS -->
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-panel">
    <div class="schedule-list" id="schedule-list">
       <!-- Populated by JS -->
    </div>
  </div>

</div>

<script>
(() => {
  const heroCard = document.getElementById("hero-card");
  const scheduleList = document.getElementById("schedule-list");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Sleek Shield Silhouette for Missing Logos
  const fallbackLogo = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.1)' stroke-width='0.5'%3E%3Cpath d='M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z'/%3E%3C/svg%3E";

  function formatRelativeTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const timeStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit"}).format(d);
    
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const matchDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

    let dayStr = "";
    if (diffDays === 0) dayStr = "HEUTE";
    else if (diffDays === 1) dayStr = "MORGEN";
    else dayStr = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);

    return { dayStr, timeStr };
  }

  async function load(){
    try{
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamData.teamDisplay || `UIC ${teamKey.toUpperCase()}`,
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentName: m.enemy_team?.name || m.enemy_team?.team_tag || "TBD" 
            });
          }
        });
      }

      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));

      if(!upcomingMatches.length){
        heroCard.innerHTML = ``;
        scheduleList.innerHTML = `<div class="empty-state">KEINE MATCHES GEPLANT</div>`;
        return;
      }
      
      // --- 1. RENDER HERO (Match [0]) ---
      const hero = upcomingMatches[0];
      const hTime = formatRelativeTime(hero.startsAt);
      const hUicLogo = hero.uicLogo ? esc(hero.uicLogo) : fallbackLogo;
      const hEnemyLogo = hero.opponentLogo ? esc(hero.opponentLogo) : fallbackLogo;

      heroCard.innerHTML = `
        <div class="glass-panel hero-container">
          <div class="hero-time">${hTime.dayStr} <span style="margin: 0 15px;">//</span> <span>${hTime.timeStr} UHR</span></div>
          <div class="hero-matchup">
            <div class="hero-team">
              <img class="hero-logo" src="${hUicLogo}" alt="UIC" onerror="this.src='${fallbackLogo}';">
              <div class="hero-name">${esc(hero.uicTeamName)}</div>
            </div>
            <div class="hero-vs">VS</div>
            <div class="hero-team">
              <img class="hero-logo" src="${hEnemyLogo}" alt="Enemy" onerror="this.src='${fallbackLogo}';">
              <div class="hero-name">${esc(hero.opponentName)}</div>
            </div>
          </div>
        </div>
      `;

      // --- 2. RENDER SCHEDULE QUEUE (Matches [1] to [5]) ---
      const queue = upcomingMatches.slice(1, 6);
      
      if(!queue.length){
        scheduleList.innerHTML = ``;
      } else {
        scheduleList.innerHTML = queue.map(m => {
          const time = formatRelativeTime(m.startsAt);
          const uLogo = m.uicLogo ? esc(m.uicLogo) : fallbackLogo;
          const eLogo = m.opponentLogo ? esc(m.opponentLogo) : fallbackLogo;

          return `
            <div class="glass-panel match-row">
              <div class="m-datetime">
                <div class="m-date">${time.dayStr}</div>
                <div class="m-time">${time.timeStr}</div>
              </div>
              <div class="m-teams">
                <div class="m-team">
                  <img class="m-logo" src="${uLogo}" onerror="this.src='${fallbackLogo}';">
                  <div class="m-name">${esc(m.uicTeamName)}</div>
                </div>
                <div class="m-vs">VS</div>
                <div class="m-team right">
                  <div class="m-name" style="color: var(--text-muted);">${esc(m.opponentName)}</div>
                  <img class="m-logo" src="${eLogo}" onerror="this.src='${fallbackLogo}';">
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

    } catch(e) {
      scheduleList.innerHTML = `<div class="empty-state">VERBINDUNG FEHLGESCHLAGEN</div>`;
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  setInterval(load, 120000); // 2 min sync
})();
</script>
</body>
</html>
