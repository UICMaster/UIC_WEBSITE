<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Ticker (OBS) - Upcoming Confirmed Matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00E5FF;
    --purple: #8A2BE2;
    --deep-blue: #0A0F1A;
    --dark-bg: rgba(7, 10, 16, 0.95);
    
    --text-main: #FFFFFF;
    --text-muted: #8E8E9F;
    
    --ticker-height: 70px; 
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    overflow: hidden; 
    background-color: rgba(0, 0, 0, 0);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text-main);
  }

  /* ================================
     TICKER CONTAINER
     ================================ */
  #ticker-container {
    position: fixed;
    bottom: 0; left: 0; width: 100vw; height: var(--ticker-height);
    background: var(--dark-bg);
    display: flex; align-items: center; overflow: hidden;
    border-top: 3px solid var(--cyan);
    box-shadow: 0 -5px 25px rgba(0, 229, 255, 0.15);
  }

  #ticker-container::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 300%; height: 100%;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 150px,
      rgba(0, 229, 255, 0.03) 150px, rgba(0, 229, 255, 0.03) 170px,
      transparent 170px, transparent 250px,
      rgba(138, 43, 226, 0.04) 250px, rgba(138, 43, 226, 0.04) 280px
    );
    animation: slideBeams 20s linear infinite;
    z-index: 0; pointer-events: none;
  }

  @keyframes slideBeams {
    0% { transform: translateX(0); }
    100% { transform: translateX(1000px); }
  }

  /* ================================
     BRANDING BLOCK
     ================================ */
  .ticker-brand {
    position: relative; z-index: 10; height: 100%;
    display: flex; align-items: center; padding: 0 40px 0 25px;
    background: linear-gradient(135deg, var(--deep-blue) 0%, #150A2A 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 25px) 100%, 0% 100%);
    border-right: 4px solid var(--purple);
  }
  
  .ticker-brand::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
    background: var(--purple); box-shadow: -2px 0 10px var(--purple);
  }
  
  .brand-logo { 
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 26px; 
    letter-spacing: 3px; color: var(--text-main);
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  
  .live-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan), 0 0 20px var(--cyan);
    margin-left: 20px; animation: blink 1.2s infinite ease-in-out;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* ================================
     SCROLLING TRACK
     ================================ */
  .ticker-viewport {
    flex: 1; height: 100%; overflow: hidden; position: relative; z-index: 1;
    mask-image: linear-gradient(to right, transparent, black 3%, black 98%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 98%, transparent);
  }

  .ticker-track {
    display: flex; height: 100%; width: max-content; will-change: transform;
  }

  @keyframes scrollTicker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ================================
     MATCH COMPONENTS & STATS
     ================================ */
  .match-item {
    display: flex; align-items: center; height: 100%; padding: 0 35px;
    position: relative; white-space: nowrap; gap: 15px;
  }

  .match-item::after {
    content: ''; position: absolute; right: 0; top: 25%; height: 50%; width: 2px;
    background: rgba(255, 255, 255, 0.1); transform: skewX(-20deg);
  }

  .m-tier-badge {
    background: rgba(138, 43, 226, 0.15);
    padding: 3px 10px;
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
    color: #D1A3FF; text-transform: uppercase; letter-spacing: 1px;
    margin-right: 5px;
  }

  .m-time-badge {
    background: rgba(255, 255, 255, 0.03);
    padding: 4px 14px;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0% 100%);
    border-left: 3px solid var(--purple);
    font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; color: var(--text-muted);
  }
  .m-time-badge.heute { border-left-color: var(--cyan); color: var(--cyan); background: rgba(0, 229, 255, 0.05); }

  .m-team { display: flex; align-items: center; gap: 12px; }
  .m-logo { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
  .m-name { font-family: 'Orbitron', sans-serif; font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }

  .m-vs { font-size: 16px; font-weight: 900; color: var(--purple); margin: 0 8px; font-style: italic; font-family: 'Orbitron', sans-serif; }

  .system-message {
    padding: 0 30px; font-family: 'Orbitron', sans-serif;
    color: var(--cyan); display: flex; align-items: center; height: 100%; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="ticker-container">
  <div class="ticker-brand">
    <span class="brand-logo">UIC</span>
    <div class="live-dot"></div>
  </div>
  
  <div class="ticker-viewport">
    <div class="ticker-track" id="ticker-track">
      <!-- Generated by JS -->
    </div>
  </div>
</div>
