<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIC Upcoming Matches (OBS)</title>
<style>
  *{box-sizing:border-box}
  /* 1. Fluid Viewport instead of fixed 200x450 */
  html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:transparent}
  body{font-family:Arial,Helvetica,sans-serif;color:#fff}
  
  /* 2. Overlay fills 100% of the given OBS Browser Source space */
  #overlay{
    width:100%;height:100%;padding:10px;
    background:linear-gradient(100deg,rgba(7,8,9,.97),rgba(14,15,16,.91));
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  #overlay:before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
    background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.05) 9px,transparent 10px 17px);
  }
  
  .brand{position:relative;text-align:left;margin-bottom:5px;flex-shrink:0}
  .brand-main{font-size:28px;line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-2px;text-shadow:0 0 5px rgba(255,255,255,0.2)}
  .brand-sub{font-size:6px;letter-spacing:2.5px;margin-top:4px;color:#ddd}
  
  .gold{color:#d7aa50}
  .rule{height:1px;background:linear-gradient(90deg,#d7aa50,#6f6f6f,transparent);margin:8px 0;flex-shrink:0}
  
  .heading{position:relative;margin-bottom:10px;flex-shrink:0}
  .heading .up{font-size:15px;font-weight:1000;letter-spacing:.5px}
  .heading .matches{font-size:22px;font-weight:1000;font-style:italic;letter-spacing:-1px;color:#d7aa50;line-height:.9;text-shadow:0 0 10px rgba(215,170,80,0.5)}
  
  #matches{position:relative;display:flex;flex-direction:column;gap:8px;flex-grow:1;min-height:0}
  
  /* 3. Matches now use flex: 1 to evenly distribute available vertical space */
  .match{flex:1;position:relative;display:flex;flex-direction:column;border-bottom:1px solid rgba(215,170,80,.72);padding-bottom:4px;min-height:0}
  
  .datebar{
    height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;
    border-top:1px solid rgba(215,170,80,.85);border-bottom:1px solid rgba(215,170,80,.85);
    background:linear-gradient(90deg,rgba(30,30,30,.95),rgba(15,15,15,.6));
    clip-path:polygon(0 0,100% 0,95% 100%,0 100%);
  }
  .date{font-size:14px;font-weight:1000;color:#eee}
  .time{font-size:14px;font-weight:1000;color:#d7aa50;text-shadow:0 0 5px rgba(215,170,80,0.6);margin-right:8px}
  
  /* 4. Versus block expands to fill the remaining space inside the match card */
  .versus{flex-grow:1;display:grid;grid-template-columns:1fr 20px 1fr;align-items:center;padding-top:4px}
  .team{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .logo{width:100%;max-width:55px;height:55px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.9))}
  .tag{font-size:10px;font-weight:900;letter-spacing:1px;margin-top:4px;max-width:75px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  
  .vs{font-size:13px;font-weight:1000;text-align:center;color:#ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-15px}
  .vs:after{content:"";display:block;width:14px;height:2px;background:#d7aa50;margin-top:4px;box-shadow:0 0 4px #d7aa50}
  
  #status{position:absolute;bottom:5px;left:10px;font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;z-index:10}
</style>
</head>
<body>
<div id="overlay">
  <div class="brand">
    <div class="brand-main">UIC</div>
    <div class="brand-sub">ULTRA INSTINCT CREW</div>
  </div>
  <div class="rule"></div>
  <div class="heading">
    <div class="up">UPCOMING</div>
    <div class="matches">MATCHES</div>
  </div>
  <div id="matches"></div>
  <div id="status"></div>
</div>
<script>
(() => {
  const matches = document.getElementById("matches");
  const status = document.getElementById("status");
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function parts(iso){
    const d = new Date(iso);
    const date = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",day:"2-digit",month:"2-digit"}).format(d);
    const time = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
    return {date, time};
  }

  async function load(){
    try{
      const r = await fetch("data/prime_stats.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) throw new Error("JSON Missing");
      const data = await r.json();

      let upcomingMatches = [];
      const now = new Date();

      for (const [teamKey, teamData] of Object.entries(data)) {
        if (!teamData.matches) continue;
        
        teamData.matches.forEach(m => {
          const mDate = new Date(m.begin);
          if (m.confirmed === true && !m.result && mDate > now) {
            upcomingMatches.push({
              startsAt: m.begin,
              uicTeamName: teamKey,
              uicLogo: teamData.api_meta?.logo_url || "", 
              opponentLogo: m.enemy_team?.logo_url || "",
              opponentTag: m.enemy_team?.team_tag || "TBD"
            });
          }
        });
      }

      upcomingMatches.sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
      const list = upcomingMatches.slice(0, 3); 

      if(!list.length){
        matches.innerHTML = "";
        status.textContent = "Keine bestätigten Matches.";
        return;
      }
      
      status.textContent = "";
      
      matches.innerHTML = list.map(m => {
        const p = parts(m.startsAt);
        return `<div class="match">
          <div class="datebar"><span class="date">${esc(p.date)}</span><span class="time">${esc(p.time)}</span></div>
          <div class="versus">
            <div class="team">
              <img class="logo" src="${esc(m.uicLogo)}" alt="UIC" onerror="this.style.opacity='0'">
              <div class="tag">${esc(m.uicTeamName)}</div>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <img class="logo" src="${esc(m.opponentLogo)}" alt="${esc(m.opponentTag)}" onerror="this.style.opacity='0'">
              <div class="tag">${esc(m.opponentTag)}</div>
            </div>
          </div>
        </div>`;
      }).join("");
      
    } catch(e) {
      matches.innerHTML = "";
      status.textContent = "Data Lake offline.";
      console.error("OBS Fetch Error:", e);
    }
  }

  load();
  setInterval(load, 300000); 
})();
</script>
</body>
</html>
